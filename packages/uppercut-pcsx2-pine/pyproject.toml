[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-pcsx2-pine"
version = "0.1.0"
description = "A client for PCSX2's PINE socket: read and write PS2 memory, batch reads, title, status, game id, save states, with an optional write allowlist."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
keywords = ["pcsx2", "pine", "ps2", "playstation-2", "emulator", "ipc", "memory"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/uppercut-labs/game-kit/tree/main/packages/uppercut-pcsx2-pine"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_pcsx2_pine"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
