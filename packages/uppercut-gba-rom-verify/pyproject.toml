[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-gba-rom-verify"
version = "0.1.0"
description = "Check a Game Boy Advance ROM header and its devkitARM ELF, and report the ROM's SHA-256."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
keywords = ["gba", "game-boy-advance", "rom", "header", "checksum", "elf", "devkitarm"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Typing :: Typed",
]

[project.scripts]
uppercut-gba-rom-verify = "uppercut_gba_rom_verify.cli:main"

[project.urls]
Source = "https://github.com/uppercut-labs/game-kit/tree/main/packages/uppercut-gba-rom-verify"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_gba_rom_verify"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
