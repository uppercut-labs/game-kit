[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-gba-asset-export"
version = "0.1.0"
description = "Export indexed pixel art for the Game Boy Advance: BGR555 palettes, 4bpp tile words, grit-style C files, 4bpp BMP and Butano JSON, and GIMP palettes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
keywords = ["gba", "game-boy-advance", "grit", "butano", "4bpp", "tiles", "palette", "bgr555", "gpl"]
dependencies = ["uppercut-retro-pixels>=0.1.0"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Graphics",
  "Typing :: Typed",
]

[tool.uv.sources]
uppercut-retro-pixels = { workspace = true }

[project.urls]
Source = "https://github.com/uppercut-labs/game-kit/tree/main/packages/uppercut-gba-asset-export"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_gba_asset_export"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
