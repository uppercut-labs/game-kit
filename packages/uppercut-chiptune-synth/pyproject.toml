[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-chiptune-synth"
version = "1.0.0"
description = "Deterministic chiptune and procedural audio for console homebrew: square, triangle and noise voices, envelopes, step sequencing, WAV and raw PCM output."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
keywords = ["chiptune", "procedural-audio", "homebrew", "wav", "pcm", "deterministic"]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
  "Typing :: Typed",
]

[project.urls]
Source = "https://github.com/uppercut-labs/game-kit/tree/main/packages/uppercut-chiptune-synth"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_chiptune_synth"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
