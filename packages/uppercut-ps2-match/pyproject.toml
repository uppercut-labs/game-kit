[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-ps2-match"
version = "0.1.0"
description = "Tooling for a PlayStation 2 matching decompilation: compile one function at a time and check its bytes against the original, place data pieces, split C files, fetch a toolchain by SHA-256 pins, audit a public repo."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
keywords = ["ps2", "playstation-2", "decompilation", "matching", "mips", "r5900", "elf", "splat"]
dependencies = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Software Development :: Disassemblers",
  "Typing :: Typed",
]

[project.scripts]
uppercut-ps2-match = "uppercut_ps2_match.cli:main"

[project.urls]
Source = "https://github.com/uppercut-labs/game-kit/tree/main/packages/uppercut-ps2-match"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_ps2_match"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
