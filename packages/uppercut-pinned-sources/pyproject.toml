[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "uppercut-pinned-sources"
version = "1.0.0"
description = "Fetch build inputs pinned by SHA-256 into a cache, refuse a mismatch, and reuse an intact cache offline."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Uppercut Labs", email = "packages@uppercut-labs.com" }]
keywords = ["sha256", "download", "cache", "reproducible-builds", "assets", "build-inputs"]
dependencies = []
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Build Tools",
  "Typing :: Typed",
]

[project.scripts]
uppercut-pinned-sources = "uppercut_pinned_sources.cli:main"

[project.urls]
Source = "https://github.com/uppercut-labs/game-kit/tree/main/packages/uppercut-pinned-sources"

[tool.hatch.build.targets.wheel]
packages = ["src/uppercut_pinned_sources"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md"]
